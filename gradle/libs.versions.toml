protobuf = { id = "com.google.protobuf", version.ref = "protobuf" }
devtool-ksp = { id = "com.google.devtools.ksp", version.ref = "devtoolKsp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }